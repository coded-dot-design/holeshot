name: Holeshot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # Pinned: ubuntu-latest is moving to 26.04, which Playwright 1.58 does not support yet.
    runs-on: ubuntu-24.04
    # Measured locally for 0.4.0: npm test about 4 min (+ the online endless rides at 1 min each),
    # test:settle about 4, test:browser about 16 (18 files): 40 leaves room on a slower runner.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # The shop (vendor/shop/) is a synced copy: it must match its ORIGIN.json.
      - run: node vendor/shop/check.mjs
      # Typecheck, build dist/ (committed: it must be the build of this commit), size.
      - run: npm run check
      - run: git diff --exit-code -- dist
      - run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length) { console.error('Holeshot ships no runtime dependencies'); process.exit(1) }"
      # Headless: the bike, tune(), the profile, every mode on every starter, the economy, allocation.
      # The online endless rides ride 1 min each here (ENDLESS_MINUTES; locally 3 min for two screens,
      # 90 s for four: about 21 minutes of npm test), so the job stays well inside its timeout.
      - run: npm test
        env:
          ENDLESS_MINUTES: "1"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:settle
      - run: npm run test:browser
      # Online on phone links (the stand-in room server's latency shim): the rollback bars.
      - run: npm run test:net
      # The site (landing, /play/), built for github.io; pages.yml deploys it.
      - run: npm run site:build
      - run: npm run test:site
  # A release: when main's package.json version has no tag yet (it was just bumped), tag that commit
  # vX.Y.Z once every check above is green. A version already tagged does nothing, so every other push
  # to main is a no-op here. How to cut a release: CONTRIBUTING.md.
  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          tag="v$(node -p 'require("./package.json").version')"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then echo "$tag is already tagged"; exit 0; fi
          git tag "$tag"
          git push origin "$tag"
          echo "Tagged $tag at $(git rev-parse --short HEAD)"
